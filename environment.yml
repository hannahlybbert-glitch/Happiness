name: happiness
channels:
  - conda-forge
dependencies:
  # Python: data cleaning (ProcessGSS/ProcessGFS) and matplotlib descriptive plots,
  # including the survey-weighted analysis (GSS_happiness_plot_weighted.py) - the
  # design-based estimator is hand-implemented in pandas/numpy, no extra package needed.
  - python=3.11
  - pandas
  - numpy
  - matplotlib
  - pyreadstat      # reads the raw GSS .sas7bdat file

  # R: regression step for the betas plot (code/descriptives/betas_plot/). Base R only
  # (lm(), matrix algebra for cluster-robust SEs) plus `here` for path resolution -
  # deliberately avoids Matrix/survey, which hit an unresolved Windows/mingw-w64 issue.
  - r-base
  - r-here
